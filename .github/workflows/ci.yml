name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Run backend checks
        run: python backend/test_backend.py
      - name: Run modular backend unit tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Run authentication boundary tests
        run: python -m unittest discover -s backend/auth/tests -t . -p 'test_*.py'
      - name: Validate launcher syntax
        run: bash -n scripts/dev.sh
