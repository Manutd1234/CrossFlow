name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Run backend checks
        run: python backend/test_backend.py
      - name: Run modular backend unit tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Validate launcher syntax
        run: bash -n scripts/dev.sh
